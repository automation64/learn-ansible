---
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/config_lookup.html
- name: "LOOKUP-BUILTIN-CONFIG"
  hosts: "main"
  become: false
  gather_facts: false

  tasks:
    - name: "Show current configuration value"
      ansible.builtin.debug:
        msg: "DEFAULT_STDOUT_CALLBACK={{ lookup('ansible.builtin.config', 'DEFAULT_STDOUT_CALLBACK') }}"
...
