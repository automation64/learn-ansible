# Reference: https://docs.ansible.com/projects/ansible/latest/collections/ansible/posix/firewalld_module.html
---
- name: "MODULE-POSIX-FIREWALLD"
  hosts: "main"
  become: false
  gather_facts: false
  check_mode: true

  tasks:
    - name: "Add service, permanently and runtime."
      become: true
      ansible.posix.firewalld:
        service: "dns"
        state: "enabled"
        permanent: true
        immediate: true

    - name: "Add port, permanently and runtime."
      become: true
      ansible.posix.firewalld:
        port: "8080/tcp"
        state: "enabled"
        permanent: true
        immediate: true

    - name: "Add port range, permanently and runtime."
      become: true
      ansible.posix.firewalld:
        port: "8080-8090/tcp"
        state: "enabled"
        permanent: true
        immediate: true
...
